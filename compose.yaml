name: rusmarket

services:
  web:
    image: nginx:1.27-alpine
    container_name: rusmarket-web
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - app_public:/var/www/public:ro
    networks:
      - rusmarket_net
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges]
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    pids_limit: 32

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rusmarket-app
    container_name: rusmarket-app
    restart: unless-stopped
    entrypoint: [/bin/sh, /usr/local/bin/entrypoint.sh]
    command: [php-fpm]
    env_file:
      - .env
    volumes:
      - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - app_public:/var/www/public
      - app_storage:/var/www/storage
      - app_cache:/var/www/bootstrap/cache
      - app_db:/var/www/database
    networks:
      - rusmarket_net
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    security_opt: [no-new-privileges]
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.75
    pids_limit: 64

networks:
  rusmarket_net:
    name: rusmarket_net
    driver: bridge

volumes:
  app_storage:
  app_cache:
  app_db:
  app_public:
